<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bem-vinda ao Mundo de Eudora</title>
    <link rel="shortcut icon" href="imagens/duda.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <main class="welcome-page">

        <!--
            IMAGEM DE FUNDO

            Depois coloque sua imagem nesta pasta:

            images/fundo-inicial.jpg

            Você pode trocar o nome no CSS.
        -->

        <div class="welcome-overlay"></div>


        <!-- CONTEÚDO -->
        <section class="welcome-content">

            <div class="welcome-decoration">
                ✦
            </div>

            <p class="welcome-small">
                UMA PEQUENA HISTÓRIA FOI FEITA PARA VOCÊ
            </p>


            <h1>
                Olá, Maria
            </h1>

            <h2>
                Bem-vinda ao
                <br>
                <span>Mundo de Eudora</span>
            </h2>


            <div class="welcome-line"></div>


            <p class="welcome-text">
                Entre sonhos, músicas, crianças,
                gatos e pequenos momentos,
                existe uma história esperando
                para ser descoberta.
            </p>


            <!-- BOTÃO -->
            <a
                href="capitulo1.html"
                class="enter-button"
            >
                <span>
                    Entrar no mundo de Eudora
                </span>

                <strong>
                    →
                </strong>
            </a>


            <p class="welcome-hint">
                Toque para começar
            </p>

        </section>


        <!-- DECORAÇÃO INFERIOR -->
        <div class="bottom-decoration">

            <span>✦</span>

            <span>♡</span>

            <span>✦</span>

        </div>

    </main>

</body>
</html>
